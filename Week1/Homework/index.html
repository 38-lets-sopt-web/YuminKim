<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>김유민의 블로그</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <header class="header">
      <div class="header-left">
        <img
          src="images/profile.jpeg"
          alt="프로필 로고"
          class="logo"
        />
      </div>

      <div class="header-center">
        <h3>김유민의 blog</h3>
      </div>

      <div class="header-right">
        <a href="https://github.com">
          <img src="images/pngegg.png" alt="깃허브 아이콘" />
        </a>
      </div>
    </header>

    <main class="main-container">
      <nav class="side-nav">
        <ul>
          <li><a href="#photo-dump-section">포토덤프</a></li>
          <li><a href="#photo-album-section">사진첩</a></Li>
          <li><a href="#interests-section">내 관심사</a></li>
          <li><a href="#to-the-web-section">To. 웹왔니</a></li>
        </ul>
      </nav>

      <div class="content-area">
        
        <h3>📸 포토덤프</h3>
        <section id="photo-dump-section" class="photo-dump">
        <div class="item item1">
          <img src="images/dump-01.jpeg">
        </div>
        <div class="item item2">
          <img src="images/dump-02.png">
        </div>
        <div class="item item3">
          <img src="images/dump-03.png">
        </div>
        <div class="item item4">
          <img src="images/dump-04.jpeg">
        </div>
        <div class="item item5">
          <img src="images/dump-05.png">
        </div>
        <div class="item item6">
          <img src="images/dump-06.jpg">
        </div>
      </section>

      <section id="photo-album-section" class="photo-album-container">
        <h3 class="album-title">🎞️ 사진첩</h3>
        
        <div class="photo-album">
          <div class="album-item">
          <img src="images/album-01.png">
        </div>
        <div class="album-item">
          <img src="images/album-02.png">
        </div>
        <div class="album-item">
          <img src="images/album-03.jpeg">
        </div>
        <div class="album-item">
          <img src="images/album-04.jpeg">
        </div>
        <div class="album-item">
          <img src="images/album-05.jpeg">
        </div>
        <div class="album-item">
          <img src="images/album-06.jpeg">
        </div>
        <div class="album-item">
          <img src="images/album-07.jpeg">
        </div>
        <div class="album-item">
          <img src="images/album-08.jpeg">
        </div>
        </div>
      </section>

      <section id="interests-section">
        <h3 class="section-title">🧩 내 관심사</h3>

        <div class="interests-grid">

          <div class="interests-card">
            <div class="card-image">
              <img src="images/interests-01.jpeg">
            </div>
            <div class="card-content">
              <h4>진격의거인</h4>
              <div class="card-buttons">
                <button class="btn-like">👍</button>
                <button class="btn-dislike">👎</button>
              </div>
            </div>
          </div>

          <div class="interests-card">
            <div class="card-image">
              <img src="images/interests-02.jpeg">
            </div>
            <div class="card-content">
              <h4>쇼핑</h4>
              <div class="card-buttons">
                <button class="btn-like">👍</button>
                <button class="btn-dislike">👎</button>
              </div>
            </div>
          </div>

          <div class="interests-card">
            <div class="card-image">
              <img src="images/interests-03.jpeg">
            </div>
            <div class="card-content">
              <h4>배틀그라운드</h4>
              <div class="card-buttons">
                <button class="btn-like">👍</button>
                <button class="btn-dislike">👎</button>
              </div>
            </div>
          </div>

          <div class="interests-card">
            <div class="card-image">
              <img src="images/interests-04.jpeg">
            </div>
            <div class="card-content">
              <h4>코코넛커피</h4>
              <div class="card-buttons">
                <button class="btn-like">👍</button>
                <button class="btn-dislike">👎</button>
              </div>
            </div>
          </div>

          <div class="interests-card">
            <div class="card-image">
              <img src="images/interests-05.jpeg">
            </div>
            <div class="card-content">
              <h4>수영</h4>
              <div class="card-buttons">
                <button class="btn-like">👍</button>
                <button class="btn-dislike">👎</button>
              </div>
            </div>
          </div>

          <div class="interests-card">
            <div class="card-image">
              <img src="images/interests-06.jpeg">
            </div>
            <div class="card-content">
              <h4>강아지</h4>
              <div class="card-buttons">
                <button class="btn-like">👍</button>
                <button class="btn-dislike">👎</button>
              </div>
            </div>
          </div>

          <div class="interests-card">
            <div class="card-image">
              <img src="images/interests-07.jpeg">
            </div>
            <div class="card-content">
              <h4>디저트</h4>
              <div class="card-buttons">
                <button class="btn-like">👍</button>
                <button class="btn-dislike">👎</button>
              </div>
            </div>
          </div>
        </div>
      </section>
      
      <section id="to-the-web-section">
        <div class="to-web-title">
          <h3>To. 우리집에 웹왔니</h3>
        </div> 
        <div class="to-web-box">
          <p class="message">웹왔니 여러분 안녕하세요 !!</p>
            <p class="message">38기 웹 화이팅 !!</p>
        </div>
      </section>

      </div>
    </main>

    <footer class="blog-footer">
      <p><strong>읽어주셔서 감사합니다</strong></p>
    </footer>

</html>
