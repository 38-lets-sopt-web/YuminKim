<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>유민이의 가계부</title>
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/main.css" />
    <link rel="stylesheet" href="./css/header.css" />
    <link rel="stylesheet" href="./css/filter.css" />
    <link rel="stylesheet" href="./css/table.css" />
    <link rel="stylesheet" href="./css/modal.css" />
  </head>

  <body>
    <!-- 헤더 -->
    <header class="header">
      <div class="header-left">
        <button id="refreshBtn" type="button" aria-label="새로고침">🏡</button>
      </div>

      <div class="header-center">
        <h1>유민이의 가계부</h1>
      </div>

      <div class="header-right">
        <p>SOPT 38th WEB</p>
      </div>
    </header>

    <main>
      <!-- 검색 필터 -->
      <section class="filter-section">
        <div class="filter-card">
          <h2 class="filter-title">검색 필터</h2>

          <div class="filter-grid">
            <label class="filter-label" for="titleInput">제목</label>
            <input
              id="titleInput"
              class="filter-input title-input"
              type="text"
              placeholder="내역을 입력하세요"
            />

            <label class="filter-label" for="typeSelect">유형</label>
            <select id="typeSelect" class="filter-input">
              <option value="">전체</option>
              <option value="income">수입</option>
              <option value="expense">지출</option>
            </select>

            <label class="filter-label" for="categorySelect">카테고리</label>
            <select id="categorySelect" class="filter-input">
              <option value="">전체</option>
              <option value="식비">식비</option>
              <option value="교통">교통</option>
              <option value="문화">문화</option>
              <option value="생활">생활</option>
              <option value="월급">월급</option>
              <option value="기타">기타</option>
            </select>

            <label class="filter-label" for="paymentSelect">결제수단</label>
            <select id="paymentSelect" class="filter-input">
              <option value="">전체</option>
              <option value="신용카드">신용카드</option>
              <option value="체크카드">체크카드</option>
              <option value="현금">현금</option>
              <option value="기타">기타</option>
            </select>

            <button type="button" class="filter-btn apply-btn">적용</button>
            <button type="button" class="filter-btn reset-btn">초기화</button>
          </div>
        </div>
      </section>

      <!-- 표 테이블 -->
      <section class="table-section">
        <div class="table-top">
          <div class="table-top-left">
            <select id="sortSelect">
              <option value="latest">날짜 내림차순</option>
              <option value="oldest">날짜 오름차순</option>
            </select>
          </div>

          <div class="table-top-right">
            <button id="deleteBtn" type="button">선택 삭제</button>
            <button id="addBtn" type="button">추가</button>
          </div>
        </div>

        <table>
          <thead>
            <tr>
              <th><input type="checkbox" id="checkAll" /></th>
              <th scope="col">제목</th>
              <th scope="col">금액</th>
              <th scope="col">날짜</th>
              <th scope="col">카테고리</th>
              <th scope="col">결제수단</th>
            </tr>
          </thead>

          <tbody id="tableBody">
            <!-- JS로 채움 -->
          </tbody>

          <tfoot>
            <tr>
              <td colspan="5">total:</td>
              <td id="total">0</td>
            </tr>
          </tfoot>
        </table>
      </section>
    </main>
    <!-- 모달 -->
    <div id="modalOverlay" class="modal-overlay hidden">
      <div class="modal">
        <div class="modal-header">
          <h2>내역 추가</h2>
          <button
            id="closeModal"
            type="button"
            class="modal-close-btn"
            aria-label="모달 닫기"
          >
            ✕
          </button>
        </div>

        <form id="modalForm" class="modal-form">
          <label>
            제목
            <input
              type="text"
              id="modalTitle"
              placeholder="제목을 입력하세요"
              required
            />
          </label>

          <div class="modal-row">
            <label>
              유형
              <select id="modalType" required>
                <option value="">선택</option>
                <option value="expense">지출 (-)</option>
                <option value="income">수입 (+)</option>
              </select>
            </label>

            <label>
              금액
              <input
                type="number"
                id="modalAmount"
                placeholder="금액을 입력하세요"
                required
              />
            </label>
          </div>

          <label>
            날짜
            <input type="date" id="modalDate" required />
          </label>

          <div class="modal-row">
            <label>
              카테고리
              <select id="modalCategory" required>
                <option value="">선택</option>
                <option value="식비">식비</option>
                <option value="교통">교통</option>
                <option value="문화">문화</option>
                <option value="생활">생활</option>
                <option value="월급">월급</option>
                <option value="기타">기타</option>
              </select>
            </label>

            <label>
              결제수단
              <select id="modalPayment" required>
                <option value="">선택</option>
                <option value="신용카드">신용카드</option>
                <option value="체크카드">체크카드</option>
                <option value="현금">현금</option>
                <option value="기타">기타</option>
              </select>
            </label>
          </div>

          <div class="modal-buttons">
            <button type="submit">추가</button>
          </div>
        </form>
      </div>
    </div>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
